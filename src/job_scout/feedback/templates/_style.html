{#- The feedback page's styles, shared with the dashboard: colour tokens (light and dark)
    and the vote form. Included inside a <style> element. #}
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1d2330; --muted: #5b6473; --line: #d9dde3;
          --accent: #1d5bd8; --ok-bg: #d5f2dc; --ok-fg: #135c26; --err: #9b1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181e; --card: #1e232b; --fg: #e6e9ef; --muted: #9aa3b2; --line: #333a45;
            --accent: #7aa7ff; --ok-bg: #1f3d29; --ok-fg: #a6e3b5; --err: #ff9b9b; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; }
  h1 { font-size: 19px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 14px; }
  .notice { background: var(--ok-bg); color: var(--ok-fg); border-radius: 8px;
            padding: 8px 12px; margin: 0 0 12px; }
  .error { color: var(--err); }
  a { color: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 16px 0 8px; display: flex; gap: 8px; }
  fieldset label { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
                   text-align: center; cursor: pointer; font-size: 17px; }
  fieldset input { margin-right: 6px; }
  textarea { box-sizing: border-box; width: 100%; min-height: 96px; font: inherit;
             background: var(--card); color: var(--fg); border: 1px solid var(--line);
             border-radius: 8px; padding: 8px; }
  button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 10px;
           border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
