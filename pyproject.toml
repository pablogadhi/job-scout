[project]
name = "job-scout"
version = "0.1.0"
description = "Finds remote jobs that fit my profile, scores them with Claude, sends a daily digest."
authors = [
    { name = "Gadhi Rodríguez", email = "pablo@gadhi.one" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.15.0",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.0",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
]

[project.scripts]
job-scout = "job_scout.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = [".claude"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Pydantic copies field defaults per instance; SQLAlchemy documents type_annotation_map this way.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]  # sample posting text has en dashes and the like on purpose
"tests/fixtures/*" = ["RUF001", "E501"]  # synthetic data literals

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits real network or a real Claude backend; run with -m live"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
