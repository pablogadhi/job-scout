# ---------------------------------------------------------------------------------------------
# SKIPPED (kept so every site from the list is accounted for)
# ---------------------------------------------------------------------------------------------

skipped:
  # Blocked by robots.txt for automated fetching (relevant, but don't scrape)
  - {name: Career Vault,  url: "https://careervault.io", reason: robots.txt disallows automated fetching}
  - {name: Jobspresso,    url: "https://jobspresso.co", reason: robots.txt disallows automated fetching}
  - {name: Authentic Jobs, url: "https://authenticjobs.com", reason: robots.txt disallows automated fetching}

  # Technically hostile or not machine-readable
  - {name: Wellfound,     url: "https://wellfound.com/jobs", reason: login wall and aggressive anti-bot protection}
  - {name: Google Jobs,   url: "https://www.google.com/search?q=remote&ibp=htl;jobs", reason: no public API; scraping violates Google's terms (paid SERP APIs exist if ever wanted)}
  - {name: JustRemote,    url: "https://justremote.co", reason: listings not present in HTML; JS app with no feed}

  # Dead, unreachable, or not a job board
  - {name: SlashJobs,     url: "https://slashjobs.com", reason: domain is for sale}
  - {name: whoishiring.io, url: "https://whoishiring.io", reason: returns an empty page}
  - {name: Remote Works,  url: "https://remote.works-hub.com", reason: site unreachable}
  - {name: Remote 4 Me,   url: "https://remote4me.com", reason: no listings; category links go to a Google Form}
  - {name: HN hiring,     url: "https://www.hnhiring.me", reason: replaced by direct HN Algolia API source (hn_whoishiring)}
  - {name: Remotees,      url: "https://weworkremotely.com", reason: list entry links to We Work Remotely; covered there}
  - {name: Stream Native Jobs, url: "https://streamnative.io/careers", reason: single company careers page with no open roles}
  - {name: FoundRole,     url: "https://foundrole.com", reason: "job-search tool, not a job board"}
