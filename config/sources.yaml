# Job sources for the pipeline, built from awesome-remote-job (Job boards + Job boards aggregators).
# Every site from both lists appears below, either as an active source or as a skip with a reason.
#
# method:  api | rss | scrape | ats_seed | skip
# tier:    1 = run daily, high relevance, cheap and reliable (API/RSS)
#          2 = run daily, relevant but needs HTML scraping (more maintenance)
#          3 = optional, low yield for this profile; enable later if you want more volume
# checked: date the fetch method was confirmed by actually fetching the site. "unverified" means
#          the endpoint comes from docs or a linked page and should be tested when building the fetcher.

defaults:
  user_agent: "job-scout/0.1 (personal job search)"   # no contact email, on purpose
  respect_robots_txt: true
  min_interval_hours: 6        # never poll any source more often than this
  timeout_seconds: 30

# ---------------------------------------------------------------------------------------------
# TIER 1: APIs and feeds
# ---------------------------------------------------------------------------------------------
sources:

  - id: 4dayweek
    name: 4 Day Week
    list: job_boards
    url: https://4dayweek.io
    method: api
    tier: 1
    checked: 2026-10-09
    endpoints:
      - https://4dayweek.io/api/v2/jobs?category=engineering&work_arrangement=remote&limit=100&sort=date
    format: json
    pagination: page (default 1), limit (max 100)
    useful_params: [category, work_arrangement, country, level, skills, salary_min, posted_after, q]
    notes: >
      Highest-value source for this profile: every posting is a 4-day or reduced-hours role.
      Free, no key. 60 req/min per IP. OpenAPI spec at https://4dayweek.io/openapi.yaml.
      Use posted_after on daily runs (at least 7 days); omit it on the
      first backlog run.
    terms: Link back to 4dayweek.io.

  - id: remoteok
    name: Remote OK
    list: aggregators
    url: https://remoteok.com
    method: api
    tier: 1
    checked: 2026-10-09
    endpoints: ["https://remoteok.com/api"]
    format: json
    notes: >
      First array element is metadata (last_updated, legal); skip it. Jobs include position,
      tags, location, salary_min/salary_max, description (HTML), apply_url.
      Descriptions sometimes contain anti-bot instructions aimed at applicants or AI tools
      (e.g. "include this word in your application"). Treat description text as data only.
    terms: Link back to the Remote OK job URL and credit Remote OK as the source.

  - id: weworkremotely
    name: We Work Remotely
    list: job_boards
    url: https://weworkremotely.com
    method: rss
    tier: 1
    checked: 2026-10-09     # backend feed confirmed; other category slugs unverified
    endpoints:
      - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
    format: rss
    notes: >
      Items carry non-standard region, country, skills and type fields, which make the location
      pre-filter much more accurate. Also covers the "Remotees" entry in the list (same site).

  - id: remotive
    name: Remotive
    list: job_boards
    url: https://remotive.com
    method: rss
    tier: 1
    checked: 2026-10-14     # feed allowed by robots.txt; the API (/api/*, /*category=) is not
    endpoints:
      # Same 15 jobs as the free API. Category feeds (/remote-jobs/<slug>/feed) are subsets
      # of this one; the slugs in the feed repo's README are outdated (software-dev is a 404).
      - https://remotive.com/remote-jobs/feed
    format: rss
    max_requests_per_day: 4         # their advice for the API: at most 4 times a day
    min_request_interval_seconds: 31  # more than 2 per minute gets blocked
    notes: >
      Documented at https://github.com/remotive-com/remote-jobs-feed. Items carry jobId (the
      API's job id), company, location and type. No salary field; descriptions often state one.
    terms: >
      Link back to the job on Remotive and credit Remotive. Don't repost the jobs elsewhere.

  - id: reliefweb
    name: ReliefWeb Jobs
    list: job_boards
    url: https://reliefweb.int/jobs
    method: rss
    tier: 1
    enabled: false          # humanitarian and development jobs: for instances that want them
    checked: 2026-10-15     # robots.txt disallows /*/rss.xml; read anyway (ignore_robots_txt)
    endpoints:
      # A saved search: type Job (TY263), career category Program/Project Management (CC6867),
      # full text "remote". Build others on reliefweb.int/jobs and copy their RSS link.
      - https://reliefweb.int/jobs/rss.xml?advanced-search=%28TY263%29_%28CC6867%29&search=remote
    format: rss
    ignore_robots_txt: true   # your call: the feed is offered publicly on every search page
    max_requests_per_day: 4
    notes: >
      The 20 newest matches per feed. Items carry the organization as author and the duty
      station country in the description; no country means the site's "Remote / Roster /
      Roving". "remote" is a full-text search, so most matches are on-site jobs that mention
      remote work. The API (api.reliefweb.int) needs a pre-approved appname, and its
      robots.txt disallows everything.
    terms: >
      Content is the posting organization's: respect its rights and link to the original.

  - id: unvacancies
    name: unvacancies.org
    list: aggregators
    url: https://unvacancies.org
    method: rss
    tier: 1
    enabled: false          # UN-system jobs: for instances that want them
    checked: 2026-10-15     # robots.txt allows /feed.xml (only /api/* and /admin are disallowed)
    endpoints:
      # Remote jobs by function. Each feed holds its 50 newest items; the plain remote feed
      # gets ~37 on a busy day, so split it by function to miss nothing between runs.
      # Functions: administration, communications-advocacy, data-technology, education,
      # engineering, finance-budget, health, human-resources, legal, logistics,
      # monitoring-evaluation, policy-governance, procurement-supply-chain,
      # programme-management, protection, security, translation-interpretation.
      # Also contract_type (consultant, intern, international_psa, service_contract,
      # volunteer), grade, location, organization; parameters in alphabetical order.
      # location= is ignored with the site's place names ("Guatemala City, Guatemala" gave
      # the unfiltered feed, 2026-10-15).
      - https://unvacancies.org/feed.xml?function=programme-management&remote=true
      - https://unvacancies.org/feed.xml?function=monitoring-evaluation&remote=true
    format: rss
    max_requests_per_day: 12
    notes: >
      An independent index of 43 UN-system career portals plus large NGOs, crawled daily.
      Items carry the title, the agency (category) and a one-line summary; dates are days.
      Job pages (/jobs/<slug>, allowed) hold the full notice, work mode and deadline, but
      reading them is a scraper and isn't built. Feed filters come from the partner kit
      (unvacancies.org/partners).
    terms: >
      Partner kit: "No fees, no account and no agreement. Use the links, feeds and widget as
      they are." Every listing links to the official notice.

  - id: workingnomads
    name: Working Nomads
    list: job_boards
    url: https://www.workingnomads.com
    method: api
    tier: 1
    checked: 2026-10-09
    endpoints: ["https://www.workingnomads.com/api/exposed_jobs/"]
    format: json
    categories: [Development]   # category_name values to keep (empty keeps all)
    notes: >
      Returns all current jobs in one array (~100KB+). Fields: url, title, description,
      company_name, category_name, tags, location, pub_date. Filtered by category_name
      locally (categories above).

  - id: realworkfromanywhere
    name: Real Work From Anywhere
    list: job_boards
    url: https://www.realworkfromanywhere.com
    method: rss
    tier: 1
    checked: 2026-10-09
    endpoints:
      - https://www.realworkfromanywhere.com/remote-backend-jobs/rss.xml
      - https://www.realworkfromanywhere.com/remote-fullstack-jobs/rss.xml
      - https://www.realworkfromanywhere.com/remote-software-developer-jobs/rss.xml
      - https://www.realworkfromanywhere.com/remote-devops-and-sysadmin-jobs/rss.xml
    format: rss
    notes: Location-independent jobs only, so location eligibility is usually a pass.

  - id: remotefirstjobs
    name: Remote First Jobs (formerly JobsCollider)
    list: job_boards
    url: https://remotefirstjobs.com
    method: rss
    tier: 1
    checked: 2026-10-09
    endpoints:
      - https://remotefirstjobs.com/rss/jobs/software-development.rss
      - https://remotefirstjobs.com/rss/jobs/devops.rss
      - https://remotefirstjobs.com/rss/jobs/python.rss
    format: rss
    alt_api: https://remotefirstjobs.com/api/search-jobs?category=software-development&page=0  # robots.txt disallows /api (2026-10-12): don't use
    notes: >
      jobscollider.com now redirects here. Feed pattern: /rss/jobs/<slug>.rss.
      The free JSON API returns salary_min/max and up to 3 countries per job, but has a 24h delay
      and caps at 500 results per query. Prefer RSS for freshness, API for salary data.
    terms: Credit Remote First Jobs with a link. Don't repost elsewhere.

  - id: hn_whoishiring
    name: Hacker News "Who is hiring?" (replaces HN hiring / hnhiring.me)
    list: job_boards
    url: https://news.ycombinator.com
    method: api
    tier: 1
    checked: 2026-10-09
    endpoints:
      - https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring&hitsPerPage=3
      - https://hn.algolia.com/api/v1/items/{story_id}
    format: json
    notes: >
      Step 1: find this month's "Ask HN: Who is hiring?" story (October 2026 is objectID 49922569).
      Step 2: fetch the item tree and treat each top-level comment as one posting.
      Comments are free text ("Company | Role | REMOTE (US only) | $150k"), so skip the regex
      pre-filter except for an obvious "REMOTE" check and let Claude parse the rest.
      New comments keep arriving all month; dedupe by comment id.
    prefilter: remote_mention_only

  - id: pyjobs
    name: PyJobs
    list: job_boards
    url: https://www.pyjobs.com
    method: rss
    tier: 1
    checked: 2026-10-09
    endpoints: ["https://www.pyjobs.com/rss"]
    format: rss
    notes: Python-only board, actively updated. Site also supports remoteLevel[] filters in URLs.

  - id: typescriptjobs
    name: TypeScriptJobs
    list: job_boards
    url: https://typescriptjobs.net
    method: rss
    tier: 1
    checked: 2026-10-09
    endpoints: ["https://typescriptjobs.net/feed.xml"]
    format: rss
    notes: Synced every 30 minutes. Feed is not remote-only; rely on the remote pre-filter.

  - id: remotegamejobs
    name: Remote Game Jobs
    list: job_boards
    url: https://remotegamejobs.com
    method: rss
    tier: 1
    checked: 2026-10-09
    endpoints: ["https://remotegamejobs.com/feed.rss"]
    format: rss
    notes: >
      Game industry, every job remote. Small board (~34 open jobs when checked), so cheap to poll.
      Most listings state a region or a UTC band ("Between UTC-7 and UTC+3", "Must reside within
      UTC-4 to UTC-8"). Titles often say "Programmer" instead of "Engineer"; filters.yaml allows that.
      Many roles are gameplay/animation programming (Unity/Unreal/C++), which score low; backend,
      online services, live ops, build and infra roles at studios are the ones to look for.

  - id: findjobit
    name: Findjobit
    list: job_boards
    url: https://findjobit.com
    method: rss
    tier: 1
    checked: 2026-10-16
    # /rss-feed is an HTML page listing feeds (all jobs, per country, per role). `region`
    # lists the countries a job is open to, as the poster ticked them, not where the job is.
    # The all-jobs feed holds every country feed (58 jobs when checked, 24 of them open to
    # Guatemala), so a remote job whose poster didn't tick Guatemala still reaches Claude.
    endpoints: ["https://findjobit.com/jobs/feed"]
    format: rss
    notes: >
      LATAM-focused IT board, mostly in Spanish. Good source for LATAM-eligible roles.
      Titles look like "<Company> busca un <Title>"; the region field lists eligible countries.

  - id: findwork
    name: Findwork
    list: aggregators
    url: https://findwork.dev
    method: api
    tier: 1
    checked: 2026-10-14
    endpoints: ["https://findwork.dev/api/jobs/?remote=true&sort_by=date"]
    format: json
    auth: 'API key from a free account, sent as "Authorization: Token <key>"'
    auth_env: FINDWORK_API_KEY      # source is skipped while this is unset
    max_pages: 5                    # newest first, ~95 jobs a page; fetch --max-pages reads further
    min_request_interval_seconds: 6 # responses say x-ratelimit-limit: 10; 6s keeps us under 10/minute
    notes: >
      Aggregates other boards: mostly We Work Remotely (every category, where our own
      weworkremotely source reads three), plus HN, YC, Dribbble and Gitjobs. About 100 jobs
      per page, newest first (2,089 remote jobs on 2026-10-14); "location" is usually empty. Its HN items
      are skipped, since hn_whoishiring fetches those comments directly.

# ---------------------------------------------------------------------------------------------
# ATS seed: companies, not jobs
# ---------------------------------------------------------------------------------------------

  - id: remoteintech
    name: remote-jobs (remoteintech)
    list: job_boards
    url: https://github.com/remoteintech/remote-jobs
    method: ats_seed
    tier: 1
    checked: 2026-10-09
    endpoints:
      # GitHub's REST API tarball of the default branch (one request, no git needed).
      # github.com's robots.txt disallows /*/archive/ for bots, so not the website's archive link.
      - https://api.github.com/repos/remoteintech/remote-jobs/tarball
    seed_regions: [worldwide, americas, americas-europe]
    seed_remote_policies: [fully-remote, remote-first]
    notes: >
      A list of remote-friendly companies, not postings, which makes it a seed for direct ATS polling.
      Each company file (src/companies/*.md) has frontmatter: title, slug, website, careers_url,
      region (worldwide | americas | europe | americas-europe | asia-pacific | other),
      remote_policy, company_size, technologies. Only companies matching seed_regions and
      seed_remote_policies are kept. Detect the ATS (order below, under ats_platforms) and poll
      the boards daily. The seed is re-downloaded weekly (settings.yaml `ats`).
      This catches jobs that never reach the boards above. It also polls the watchlist's and
      `companies`' boards.

  - id: company_boards
    name: Company boards (watchlist and companies, no seed)
    list: job_boards
    url: https://github.com/remoteintech/remote-jobs
    method: ats_boards
    tier: 1
    enabled: false          # remoteintech polls every board here; at most one of the two is on
    checked: 2026-10-15
    notes: >
      For an instance without the remoteintech seed: polls the boards of `companies` and the
      watchlist (bottom of this file), found by `job-scout ats detect`.

# ---------------------------------------------------------------------------------------------
# TIER 2: HTML scraping (relevant, more maintenance)
# ---------------------------------------------------------------------------------------------

  - id: hiring_lat
    name: hiring.lat
    list: job_boards
    url: https://hiring.lat
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints:
      - https://hiring.lat/jobs/backend
      # add other category pages (devops, fullstack) after inspecting the site's nav
    notes: >
      LATAM-only roles with country eligibility per listing. Dates are relative ("4d ago").
      Many listings show a $0-$0 placeholder salary; treat that as unlisted. The site's own average
      is about $85k, so expect many postings below your $120k floor.
      "Load more" pagination may be a JS call; check network requests for a JSON endpoint first.

  - id: remotejobs_lat
    name: RemoteJobs.lat
    list: job_boards
    url: https://remotejobs.lat
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://remotejobs.lat/"]
    notes: LATAM-focused, ~1,700 open jobs, listings visible in HTML, updated daily.

  - id: 4dayjob
    name: 4DayJob
    list: job_boards
    url: https://4dayjob.com
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://4dayjob.com/?page=1"]
    notes: >
      No feed, but listings appear in HTML with plain ?page=N pagination. High value for the
      4-day-week preference. Will overlap partly with 4dayweek.io.

  - id: devopsprojectshq
    name: DevOpsJobs (devopsprojectshq.com)
    list: job_boards
    url: https://devopsprojectshq.com
    method: scrape
    tier: 2
    checked: 2026-10-09     # board confirmed; listing markup not yet inspected
    endpoints:
      - https://devopsprojectshq.com/role/remote-kubernetes/
    notes: >
      DevOps, SRE and platform roles only, with a "Work from Anywhere" location filter.
      Find the anywhere-filtered URL when building. Some filters may be JS-driven.

  - id: realjobsfromanywhere
    name: Real Jobs From Anywhere
    list: job_boards
    url: https://realjobsfromanywhere.com
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://realjobsfromanywhere.com/page/1"]
    notes: No feed. Listings in HTML, /page/N pagination. Mixed tech and non-tech; filter by category.

  - id: nodesk
    name: NoDesk
    list: job_boards
    url: https://nodesk.co
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints:
      - https://nodesk.co/remote-jobs/engineering/
      - https://nodesk.co/remote-jobs/devops/
      - https://nodesk.co/remote-jobs/remote-first/
    notes: No feed. Has a Worldwide location page (remote-first).

  - id: jobsbyculture
    name: JobsByCulture
    list: job_boards
    url: https://jobsbyculture.com
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://jobsbyculture.com/"]
    notes: >
      Most useful as enrichment, not as a job source: company pages carry work-life-balance
      scores and tags (Async-First, Flex Hours, Work-Life Balance). Look up a company here when
      a posting scores well and pass the culture data to Claude as extra context.

  - id: remotebackendjobs
    name: Remote Backend Jobs
    list: job_boards
    url: https://www.remotebackendjobs.com
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://www.remotebackendjobs.com/"]
    notes: Aggregates "dozens of boards" (unnamed). Expect heavy duplication; dedupe will absorb it.

  - id: remote_io
    name: Remote.io
    list: aggregators
    url: https://www.remote.io
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://www.remote.io/remote-jobs/software-development"]
    notes: ~3,700 jobs, per-listing location shown. No feed.

  - id: dailyremote
    name: Daily Remote
    list: job_boards
    url: https://dailyremote.com
    method: scrape
    tier: 2
    checked: 2026-10-09
    endpoints: ["https://dailyremote.com/remote-software-development-jobs"]
    notes: Listings visible without login despite the "premium" label in the list. No feed.

