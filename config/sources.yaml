# ---------------------------------------------------------------------------------------------
# ATS endpoint templates (used by the remoteintech seed, `companies` and the watchlist)
# Greenhouse verified 2026-10-09 (Canonical); Lever, Ashby, Workable and Recruitee payload
# shapes checked 2026-10-12. SmartRecruiters removed 2026-10-12: api.smartrecruiters.com's
# robots.txt disallows every bot (`User-agent: * / Disallow: /`); its companies end up as
# unknown_ats. Ashby's API host answers robots.txt with HTTP 401, which RFC 9309 treats as
# "unavailable" (allowed), so it is polled. Workday checked 2026-10-15 on two NGO boards: a
# token is host/tenant/site (the tenant comes from the board page, since the API's isn't
# always the host's), the job list answers only a POST, and each new job's description is
# one more request, made only when its title passes filters.yaml. Jobvite and iCIMS checked
# 2026-10-15 (Heifer, Pact): no jobs API; the board's jobs page (Jobvite) or sitemap (iCIMS)
# lists the jobs, and each job's page has a schema.org JobPosting, read under the same rule.
# Neither host's robots.txt disallows those pages (jobs.jobvite.com has none).
#
# ATS detection, in order (stop at the first hit):
#   1. careers_url host matches a `detect` pattern below.
#   2. Fetch the careers page and look for links or embeds pointing at a detect pattern.
#      Needed because many companies host careers on their own domain
#      (e.g. Canonical: canonical.com/careers/all is backed by Greenhouse).
#   3. Try the company slug against each ATS API; a 200 with jobs means a match (not
#      Workday, Jobvite or iCIMS: their hosts can't be guessed, or a page per company each
#      month would be too many requests).
#   4. Otherwise mark the company "unknown_ats" and list it in a weekly report for manual review.
# Cache the result per company; re-detect monthly.
# ---------------------------------------------------------------------------------------------

ats_platforms:
  greenhouse:      {detect: "boards.greenhouse.io|job-boards.greenhouse.io", api: "https://boards-api.greenhouse.io/v1/boards/{token}/jobs?content=true"}
  lever:           {detect: "jobs.lever.co",          api: "https://api.lever.co/v0/postings/{company}?mode=json"}
  ashby:           {detect: "jobs.ashbyhq.com",       api: "https://api.ashbyhq.com/posting-api/job-board/{board}?includeCompensation=true"}
  workable:        {detect: "apply.workable.com|[a-z0-9-]+\\.workable\\.com", api: "https://apply.workable.com/api/v1/widget/accounts/{account}?details=true"}
  recruitee:       {detect: "recruitee.com",          api: "https://{company}.recruitee.com/api/offers/"}
  workday:         {detect: "myworkdayjobs\\.com|myworkdaysite\\.com", api: "https://{host}/wday/cxs/{tenant}/{site}/jobs"}
  jobvite:         {detect: "jobs\\.jobvite\\.com",   api: "https://jobs.jobvite.com/{company}/jobs"}
  icims:           {detect: "\\.icims\\.com",          api: "https://{portal}.icims.com/sitemap.xml"}

# ---------------------------------------------------------------------------------------------
# Watchlist: companies you specifically want to work for.
# Polled daily regardless of what the seed lists say. An entry here overrides auto-detection.
# Matching postings get flagged as "watchlist" in the digest so they're never buried.
# ---------------------------------------------------------------------------------------------

watchlist:
  - company: Canonical
    careers_url: https://canonical.com/careers/all
    ats: greenhouse
    token: canonical
    checked: 2026-10-09
    notes: >
      Also in remoteintech (region: worldwide, fully-remote). Large board including many
      non-engineering roles. Location names look like "Home based - Worldwide" or
      "Home Based - Americas", which the location allow-list already matches.

# ---------------------------------------------------------------------------------------------
# Companies: this instance's own organizations, detected like seed companies (`ats detect`)
# and polled once their board is found. For an instance whose field the remoteintech seed
# doesn't cover. A watchlist entry for the same company wins.
# ---------------------------------------------------------------------------------------------

companies: []
