# Runtime settings for job-scout.
# Precedence for every value: CLI flag > environment variable > this file > built-in default.

scoring:
  # Which backend scores postings. Switch at any time; already-stored scores stay valid.
  #   cli: the `claude` CLI in headless mode, billed to the Claude Pro subscription
  #   api: the Anthropic Messages API, billed per token to an API key
  # Override: --backend cli|api  or  JOB_SCOUT_BACKEND=cli|api
  backend: cli

  # Model for both backends. Full model ID so the CLI and API resolve the same model.
  # Override: --model <id>  or  JOB_SCOUT_MODEL=<id>
  # Default since 2026-10-12. claude-haiku-4-5 still works, with effort: null.
  model: claude-haiku-5-5
  # Thinking effort: low | medium | high | xhigh | max, or null to not send it.
  # Haiku 4.5 rejects it (keep null); Haiku 5.5 defaults to medium.
  # Override: JOB_SCOUT_SCORING__EFFORT=low
  effort: medium

  description_max_chars: 20000 # posting description is truncated to this before scoring

  # Batching. A "call" is one CLI invocation or one API request.
  # Postings are packed into a call until ANY limit is reached:
  #   postings_per_call, max_input_tokens_per_call, or max_output_tokens_per_call
  #   (tokens estimated as characters / 4; output estimated at ~450 tokens per posting).
  # max_calls caps how many calls one run may make; leftovers stay pending for the next run.
  # Pick a mode with --mode daily|backlog. Override any value with flags:
  #   --postings-per-call N  --max-calls N  --max-input-tokens N
  modes:
    daily:
      cli:
        postings_per_call: 10 # 15 per call left out ~6% of results (retried); about 200 a day
        max_calls: 20
        max_input_tokens_per_call: 60000
        max_output_tokens_per_call: 12000
      api:
        postings_per_call: 1 # one posting per request (the prompt is too short to cache)
        max_calls: 500
        use_batches_api: true
    backlog:
      cli:
        postings_per_call: 10 # 40 per call lost 33 of 50 results, 60 timed out; 15 left out ~6%
        max_calls: 25
        max_input_tokens_per_call: 60000
        max_output_tokens_per_call: 12000
      api:
        postings_per_call: 1
        max_calls: 10000
        use_batches_api: true # Message Batches API: cheaper, no rate-limit pressure

  # Order in which pending postings are scored when a run can't score them all.
  order: newest_first # newest_first | oldest_first

  cli:
    binary: claude
    workdir: data/claude-cwd # empty dir: no CLAUDE.md, hooks or MCP config
    timeout_seconds: 600
    # Auth: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (valid one year).
    # The subprocess gets an allowlisted environment: ANTHROPIC_* never reaches it.
    # YYYY-MM-DD; `status` and the digest warn 30 days before expiry. Usually set per
    # machine with JOB_SCOUT_SCORING__CLI__TOKEN_CREATED.
    token_created: null

  api:
    # Auth: ANTHROPIC_API_KEY, only ever passed to the API backend.
    prompt_caching: true
    max_spend_usd_per_run: 5.00 # stop scoring when the run's estimated spend reaches this
    max_retries: 3
    batch_poll_seconds: 60 # Batches API: how often to poll a submitted batch
    batch_max_wait_minutes: 120 # stop waiting (the batch keeps running); the next run resumes
    # USD per million tokens, per model. Batches API usage is billed at batch_discount × these.
    # Check https://platform.claude.com/docs/en/models/overview when changing models.
    batch_discount: 0.5
    # Added to max_tokens on every request: room for thinking on models that think by
    # default (Haiku 5.5); thinking counts toward max_tokens. Unused tokens cost nothing.
    thinking_headroom_tokens: 8000
    prices:
      claude-haiku-4-5:
        input: 1.00
        output: 5.00
        cache_write: 1.25 # 5-minute cache writes (1.25 × input)
        cache_read: 0.10 # 0.1 × input
      claude-haiku-5-5: # prompts up to 100k tokens; above that, 5× these
        input: 0.10
        output: 0.50 # includes thinking tokens
        cache_write: 0.125
        cache_read: 0.01

digest:
  min_score: 60
  watchlist_min_score: 21 # watchlist jobs appear unless disqualified
  watchlist_collapse_below: 50 # weaker watchlist jobs are listed collapsed
  send_when_empty: true # still email a digest with no new matches (health footer)
  rescored_max_age_days: 14 # a job re-ranked into the digest must be this recent (0: never)
  # The HTML digest is always written under paths.reports. Email is sent in addition when
  # enabled: Proton SMTP submission from an alias. The SMTP token is read only from the
  # JOB_SCOUT_SMTP_TOKEN environment variable, never from this file.
  email:
    enabled: true
    smtp_host: smtp.protonmail.ch
    smtp_port: 587 # STARTTLS
    from_address: job-scout@gadhi.one # the alias; also the SMTP username

ats:
  # Company job boards from the remoteintech seed and the watchlist (sources.yaml).
  seed_refresh_days: 7 # re-download the seed list this often
  redetect_days: 30 # re-detect each company's board this often
  max_detections_per_run: 40 # `run` caps detection work; `ats detect` has no cap

feedback:
  # Thumbs up/down links in the digest open a page served by `job-scout feedback serve` (the
  # compose service `feedback`). Two env vars, no settings here: the page's address as seen
  # from where you read the digest, JOB_SCOUT_FEEDBACK__BASE_URL (e.g. http://jobscout.lan:8765),
  # and the link-signing secret, JOB_SCOUT_FEEDBACK_SECRET. No links while either is unset.
  host: 127.0.0.1 # listening address; the compose service sets 0.0.0.0 in the container
  port: 8765
  prompt_examples: 8 # recent judgments added to the scoring prompt as examples (0: none)

schedule:
  timezone: America/Guatemala
  daily_run_time: "08:15" # the server boots at 08:00; keep in sync with deploy/systemd/job-scout.timer

# Relative to the working directory: the repo root, or /app in the container, where the
# repo's gitignored data/ is mounted.
paths:
  database: data/job-scout.db
  reports: data/reports
  exports: data/exports # job-scout export (CSV, --sqlite snapshot)
