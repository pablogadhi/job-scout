# job-scout on the home server (deploy/README.md). systemd starts one-off runs:
#   docker compose run --rm -T job-scout run
# and the feedback page runs as a long-lived service:
#   docker compose up -d feedback
# Everything stays in the repo checkout (~/job-scout): config/ mounted read-only, the
# gitignored data/ for the database, reports and the claude CLI's home, and the gitignored
# .env (mode 600) for secrets.
#
# Another instance (another person's profile) lives in instances/<name>/ with the same
# config/, data/ and .env. Select it with its .env, which sets COMPOSE_PROJECT_NAME,
# JOB_SCOUT_INSTANCE_DIR and JOB_SCOUT_FEEDBACK_PORT:
#   docker compose --env-file ../instances/<name>/.env run --rm -T job-scout run
name: job-scout

x-job-scout: &job-scout
  image: job-scout:local
  env_file: ${JOB_SCOUT_INSTANCE_DIR:-..}/.env
  volumes:
    - ${JOB_SCOUT_INSTANCE_DIR:-..}/config:/app/config:ro
    - ${JOB_SCOUT_INSTANCE_DIR:-..}/data:/app/data
  init: true

services:
  job-scout:
    <<: *job-scout
    build:
      context: ..
      args:
        UID: "${JOB_SCOUT_UID:-1000}"
        GID: "${JOB_SCOUT_GID:-1000}"
    restart: "no"

  # The page the digest's thumbs up/down links open. Same image; build it with the
  # service above. Publishes feedback.port (8765 in the container) on the
  # server's LAN address; to pin one interface use e.g. "192.168.1.10:8765:8765".
  # Each instance needs its own host port (JOB_SCOUT_FEEDBACK_PORT in its .env).
  feedback:
    <<: *job-scout
    command: ["feedback", "serve"]
    pull_policy: never # job-scout:local is built here, never pulled
    environment:
      JOB_SCOUT_FEEDBACK__HOST: 0.0.0.0
    ports:
      - "${JOB_SCOUT_FEEDBACK_PORT:-8765}:8765"
    restart: unless-stopped
