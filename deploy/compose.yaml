# job-scout on the home server (deploy/README.md). systemd starts one-off runs:
#   docker compose run --rm -T job-scout run
# Paths: the repo checkout is /opt/job-scout, data lives in /var/lib/job-scout (the paths in
# config/settings.yaml), secrets in /etc/job-scout/job-scout.env (mode 600, never in git).
name: job-scout

services:
  job-scout:
    build:
      context: ..
      args:
        UID: "${JOB_SCOUT_UID:-1000}"
        GID: "${JOB_SCOUT_GID:-1000}"
    image: job-scout:local
    env_file: /etc/job-scout/job-scout.env
    volumes:
      - ../config:/app/config:ro
      - /var/lib/job-scout:/var/lib/job-scout
    init: true
    restart: "no"
